default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 2 } %>
  # Vercel Postgres (Neon) — injects POSTGRES_URL or DATABASE_URL
  url: <%= ENV['POSTGRES_URL'] || ENV['DATABASE_URL'] || "postgresql://postgres:postgres@localhost:5432/knowledge_platform_#{Rails.env}" %>
  # Neon requires sslmode=require in production
  sslmode: <%= Rails.env.production? ? 'require' : 'prefer' %>

development:
  <<: *default
  database: knowledge_platform_development

test:
  <<: *default
  database: knowledge_platform_test

production:
  <<: *default
  # URL is fully taken from POSTGRES_URL env var (set by Vercel Postgres)
